# ==============================================================
# Clash Meta - AI 专用配置 v4.0（模板版）
# 节点通过 proxy-providers 动态拉取，无需手动编辑节点信息
# 使用方法：将 proxy-providers 中的 URL 替换为你的订阅链接即可
# 作者：wsuming97  更新：2026-06-03
# ==============================================================

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  enhanced-mode: fake-ip
  ipv6: false                    # ← 关闭 IPv6 防泄露（对齐 iOS 三端配置）
  nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  nameserver-policy:
    # 国内域名走国内 DNS
    "geosite:cn,private":
      - https://120.53.53.53/dns-query
      - https://223.5.5.5/dns-query
    # 非中国域名走海外 DNS
    "geosite:geolocation-!cn":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
    # ====== AI 域名强制走海外 DNS（防污染，最高优先级）======
    "+.anthropic.com,+.claude.ai,+.claude.com,+.clau.de,+.claudeusercontent.com":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
    "+.openai.com,+.chatgpt.com,+.oaiusercontent.com,+.oaistatic.com,+.sora.com":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
    "+.gemini.google.com,+.generativelanguage.googleapis.com,+.aistudio.google.com,+.deepmind.com,+.deepmind.google":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
    "+.githubcopilot.com,+.copilot.microsoft.com":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
    # ====== 社交与流媒体域名强制走海外 DNS（防污染）======
    "+.twitter.com,+.twimg.com,+.x.com,+.tiktok.com,+.tiktokv.com,+.byteoversea.com":
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
  proxy-server-nameserver:
    - https://120.53.53.53/dns-query
    - https://223.5.5.5/dns-query
  respect-rules: true


# ==============================================================
# 节点：留空，全部通过 proxy-providers 动态拉取
# ==============================================================
proxies: []


# ==============================================================
# 订阅源（proxy-providers）
# 使用说明：
#   1. 将 url 中的占位文字替换为你的订阅链接
#   2. 支持多个订阅源，取消 sub2 的注释即可启用
#   3. 节点会自动拉取并按 interval 周期更新
#   4. health-check 会自动剔除不可用节点
# ==============================================================
proxy-providers:
  # ────── 主订阅源 ──────
  sub1:
    type: http
    url: "在此粘贴你的订阅链接1"       # ← 替换为你的机场 Clash 订阅链接
    path: ./proxies/sub1.yaml
    interval: 3600                      # 每小时自动更新一次节点
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300                     # 每 5 分钟检测一次节点可用性
      lazy: false                       # 启动时立即检测，不等首次使用

  # ────── 备用订阅源（可选，不需要可保持注释）──────
  # sub2:
  #   type: http
  #   url: "在此粘贴你的订阅链接2"
  #   path: ./proxies/sub2.yaml
  #   interval: 3600
  #   health-check:
  #     enable: true
  #     url: https://www.gstatic.com/generate_204
  #     interval: 300
  #     lazy: false

  # ────── 本地节点文件（可选，适合自建节点）──────
  # local-nodes:
  #   type: file
  #   path: ./proxies/local.yaml        # ← 将自建节点写在此文件中
  #   health-check:
  #     enable: true
  #     url: https://www.gstatic.com/generate_204
  #     interval: 300


# ==============================================================
# 策略组
# 说明：
#   - use 引用 proxy-providers，节点会自动填充
#   - 如启用了 sub2，在 use 列表中加入 sub2 即可合并节点
#   - filter 可按正则筛选节点名，如 "(?i)美国|US" 只显示美国节点
# ==============================================================
proxy-groups:
  # ────── 手动选择入口 ──────
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2                          # 启用备用订阅时取消注释

  # ────── 自动选择最快节点 ──────
  - name: ♻️ 自动选择
    type: url-test
    use:
      - sub1
      # - sub2
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50                       # 延迟差距 <50ms 不切换，避免频繁跳转
    lazy: false

  # ────── AI 服务（建议选择美国/日本/新加坡节点）──────
  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2
    # filter: "(?i)美国|US|日本|JP|新加坡|SG"   # ← 取消注释可只显示特定地区节点

  # ────── 油管视频 ──────
  - name: 📹 油管视频
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2

  # ────── 谷歌服务 ──────
  - name: 🔍 谷歌服务
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2

  # ────── 私有网络 ──────
  - name: 🏠 私有网络
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - REJECT

  # ────── 国内服务（默认直连）──────
  - name: 🔒 国内服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  # ────── 电报消息 ──────
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2

  # ────── Github ──────
  - name: 🐱 Github
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2

  # ────── 交易所 ──────
  - name: 🪙 交易所
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2

  # ────── 推特消息 ──────
  - name: 🐦 推特消息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2

  # ────── TikTok ──────
  - name: 🎵 TikTok
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2

  # ────── 兜底：未命中任何规则的流量 ──────
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - REJECT
    use:
      - sub1
      # - sub2


